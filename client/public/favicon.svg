<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a084e"/>
      <stop offset="50%" stop-color="#190633"/>
      <stop offset="100%" stop-color="#0c021a"/>
    </linearGradient>

    <!-- Center Purple Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#190633" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Uno Card Gradient -->
    <linearGradient id="unoCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260812"/>
      <stop offset="100%" stop-color="#14031c"/>
    </linearGradient>

    <!-- Uno Center Oval Gradient -->
    <linearGradient id="unoOvalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Shape with Background & Center Glow -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#centerGlow)"/>

  <!-- Left Card: UNO NO MERCY Card (Tilted -15deg) -->
  <g transform="translate(195, 235) rotate(-15)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect x="-65" y="-95" width="130" height="190" rx="14" fill="url(#unoCardGrad)" stroke="#ef4444" stroke-width="4"/>
    <rect x="-59" y="-89" width="118" height="178" rx="10" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Tilted Center Oval -->
    <g transform="rotate(-22)">
      <ellipse cx="0" cy="0" rx="44" ry="64" fill="url(#unoOvalGrad)" stroke="#ffffff" stroke-width="3.5"/>
      <!-- UNO Text -->
      <text x="0" y="8" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="26" fill="#ffffff" stroke="#991b1b" stroke-width="4" paint-order="stroke fill" text-anchor="middle">UNO</text>
    </g>

    <!-- Corner "+4" -->
    <text x="-56" y="-72" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#facc15">#4</text>
    <text x="36" y="82" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#facc15">#4</text>
  </g>

  <!-- Right Card: Donkey Master Royal Card (Tilted +14deg) -->
  <g transform="translate(315, 235) rotate(14)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect x="-65" y="-95" width="130" height="190" rx="14" fill="#f8fafc" stroke="#d97706" stroke-width="4"/>
    <rect x="-58" y="-88" width="116" height="176" rx="9" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Center Royal Spade & Crown Accent -->
    <text x="0" y="24" font-family="Arial, serif" font-weight="900" font-size="56" fill="#0f172a" text-anchor="middle">&#9824;</text>

    <!-- Little Golden Crown atop Spade -->
    <polygon points="-16,-2 -20,-24 -9,-15 0,-28 9,-15 20,-24 16,-2" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>

    <!-- Corner "K" and Spade -->
    <text x="-56" y="-72" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#b45309">K</text>
    <text x="-56" y="-55" font-family="Arial, serif" font-size="13" font-weight="900" fill="#b45309">&#9824;</text>
    
    <text x="42" y="60" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#b45309">K</text>
    <text x="42" y="78" font-family="Arial, serif" font-size="13" font-weight="900" fill="#b45309">&#9824;</text>
  </g>

  <!-- Majestic Royal King Crown -->
  <g transform="translate(256, 126)" filter="url(#shadow)">
    <!-- Crown Body -->
    <polygon points="-95,44 -112,-26 -58,6 -36,-56 0,2 36,-56 58,6 112,-26 95,44" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4"/>

    <!-- Crown Base Band -->
    <rect x="-92" y="24" width="184" height="24" rx="6" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2.5"/>

    <!-- Jewels -->
    <!-- Center Giant Ruby -->
    <ellipse cx="0" cy="-80" rx="12" ry="12" fill="#ef4444" stroke="#fef08a" stroke-width="2.5"/>
    <ellipse cx="-3" cy="-83" rx="4" ry="4" fill="#ffffff" opacity="0.7"/>

    <!-- Mid Emeralds -->
    <ellipse cx="-45" cy="-62" rx="9" ry="9" fill="#10b981" stroke="#fef08a" stroke-width="2"/>
    <ellipse cx="45" cy="-62" rx="9" ry="9" fill="#10b981" stroke="#fef08a" stroke-width="2"/>

    <!-- Outer Rubies -->
    <ellipse cx="-118" cy="-34" rx="8" ry="8" fill="#ef4444" stroke="#fef08a" stroke-width="2"/>
    <ellipse cx="118" cy="-34" rx="8" ry="8" fill="#ef4444" stroke="#fef08a" stroke-width="2"/>

    <!-- Band Jewels -->
    <circle cx="-65" cy="36" r="6" fill="#ef4444"/>
    <circle cx="-25" cy="36" r="6" fill="#10b981"/>
    <circle cx="25" cy="36" r="6" fill="#ef4444"/>
    <circle cx="65" cy="36" r="6" fill="#10b981"/>
  </g>

  <!-- Sparkles -->
  <g filter="url(#glow)">
    <!-- Top-left sparkle -->
    <path d="M 110,140 Q 110,165 85,165 Q 110,165 110,190 Q 110,165 135,165 Q 110,165 110,140 Z" fill="#fef08a"/>
    <circle cx="110" cy="165" r="4" fill="#ffffff"/>

    <!-- Top-right sparkle -->
    <path d="M 405,150 Q 405,175 380,175 Q 405,175 405,200 Q 405,175 430,175 Q 405,175 405,150 Z" fill="#fef08a"/>
    <circle cx="405" cy="175" r="4" fill="#ffffff"/>

    <!-- Mid sparkle -->
    <path d="M 125,320 Q 125,335 110,335 Q 125,335 125,350 Q 125,335 140,335 Q 125,335 125,320 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Royal Plaque / Banner -->
  <g transform="translate(256, 410)" filter="url(#shadow)">
    <!-- Ribbon background -->
    <rect x="-180" y="-38" width="360" height="76" rx="20" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Glass highlight line -->
    <rect x="-174" y="-34" width="348" height="32" rx="12" fill="#ffffff" opacity="0.18"/>

    <!-- Main Title: DONKEY MASTER -->
    <text x="0" y="-5" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#fef08a" stroke="#000000" stroke-width="2.5" paint-order="stroke fill" text-anchor="middle" letter-spacing="1">DONKEY MASTER</text>
    
    <!-- Subtitle: & UNO NO MERCY -->
    <text x="0" y="23" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#fca5a5" stroke="#450a0a" stroke-width="1.8" paint-order="stroke fill" text-anchor="middle" letter-spacing="0.5">&amp; UNO NO MERCY</text>
  </g>

  <!-- Luxury Outer Gold Metallic Border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.7"/>
</svg>